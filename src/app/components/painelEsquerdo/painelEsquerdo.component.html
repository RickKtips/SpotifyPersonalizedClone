<section>
<header>
    <h1><span class="logo"></span>Music Player</h1>
</header>
        <app-botao-menu [descricao]="'Home'"
         [selecionado]="menuSelecionado === 'home'"
         [tamanho]="'g'"
         (click)="botaoClick('home')"
         >    
            <fa-icon [icon]="homeIcone"></fa-icon>       
        </app-botao-menu>
        <app-botao-menu  [descricao]="'Pesquisar'"
        [selecionado]="menuSelecionado === 'Pesquisar'"
        [tamanho]="'g'"
        (click)="botaoClick('Pesquisar')">
            <fa-icon [icon]="pesquisarIcone"></fa-icon>
        </app-botao-menu>
        <app-botao-menu  [descricao]="'Artistas'"
        [selecionado]="menuSelecionado === 'Artistas'"
        [tamanho]="'g'"
        (click)="botaoClick('Artistas')">
            <fa-icon [icon]="artistaIcone"></fa-icon>
        </app-botao-menu>
<h2>Playlists</h2>
<div>
       <app-botao-menu 
        *ngFor="let playlist of playlists"
        [descricao]="playlist.nome"
        [selecionado]="menuSelecionado === playlist.id"
        (click)="irParaPlaylist(playlist.id)">
            <fa-icon [icon]="playlistIcone"></fa-icon>
        </app-botao-menu> 
    </div>
<footer>
<app-rodape-usuario>
</app-rodape-usuario>
</footer>
</section>
